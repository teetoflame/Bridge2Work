apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopedge-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopedge
  template:
    metadata:
      labels:
        app: shopedge
    spec:
      containers:
      - name: shopedge-container
        image: your-dockerhub-username/shopedge-app:latest
        ports:
        - containerPort: 80
